name: RaceDay Part 1 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-planning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Show Repository Files
        run: |
          echo "Files in repository:"
          find . -maxdepth 3 -type f | sort
          
      - name: Check Docs Folder
        run: |
          test -d "docs" || (echo "ERROR: docs folder is missing" && exit 1)

       - name: Check Required Files
         run: |
          echo "Checking ERD..."
          test -f "docs/ERD.pdf" && echo "ERD.pdf FOUND" || (echo "ERD.pdf MISSING" && exit 1)

          echo "Checking API Endpoint Plan..."
          test -f "docs/endpoint-plan.md" && echo "endpoint-plan.md FOUND" || (echo "endpoint-plan.md MISSING" && exit 1)

          echo "Checking Role-Based Design..."
          test -f "docs/Role_Based_Design.pdf" && echo "Role_Based_Design.pdf FOUND" || (echo "Role_Based_Design.pdf MISSING" && exit 1)

          echo "Checking SQL..."
          test -f "docs/RaceDayDB.sql" && echo "RaceDayDB.sql FOUND" || (echo "RaceDayDB.sql MISSING" && exit 1)

          echo "Checking README..."
          test -f "README.md" && echo "README.md FOUND" || (echo "README.md MISSING" && exit 1)

      - name: Check SQL Contains Tables
        run: |
          grep -qi "CREATE TABLE" docs/RaceDayDB.sql || exit 1

      - name: Part 1 Validation Complete
        run: echo "RaceDay Part 1 validation passed successfully."
