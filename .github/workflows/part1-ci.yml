
name: RaceDay Part 2 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set Up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Show Repository Files
        run: |
          echo "Files in repository:"
          find . -maxdepth 5 -type f | sort

      - name: Check Docs Folder
        run: |
          test -d "docs" || (echo "ERROR: docs folder is missing" && exit 1)

      - name: Check Required Part 1 Files
        run: |
          echo "Checking ERD..."
          test -f "docs/ERD.pdf" || (echo "ERROR: ERD.pdf missing" && exit 1)

          echo "Checking API Endpoint Plan..."
          test -f "docs/endpoint-plan.md" || (echo "ERROR: endpoint-plan.md missing" && exit 1)

          echo "Checking Role-Based Design..."
          test -f "docs/Role_Based_Design.pdf" || (echo "ERROR: Role_Based_Design.pdf missing" && exit 1)

          echo "Checking SQL..."
          test -f "docs/RaceDayDB.sql" || (echo "ERROR: RaceDayDB.sql missing" && exit 1)

          echo "Checking README..."
          test -f "README.md" || (echo "ERROR: README.md missing" && exit 1)

      - name: Check SQL Contains Table Definitions
        run: |
          grep -qi "CREATE TABLE" docs/RaceDayDB.sql || (echo "ERROR: No CREATE TABLE statements found" && exit 1)

      - name: Locate Solution File
        shell: bash
        run: |
          solution=$(find . -maxdepth 5 -type f \( -name '*.sln' -o -name '*.slnx' \) -print -quit)

          if [ -z "$solution" ]; then
            echo "ERROR: No .NET solution file (.sln or .slnx) found."
            echo "Check that your solution file is committed to GitHub."
            exit 1
          fi

          echo "Found solution: $solution"
          echo "SOLUTION_FILE=$solution" >> "$GITHUB_ENV"

      - name: Restore Dependencies
        run: dotnet restore "$SOLUTION_FILE"

      - name: Build Solution
        run: dotnet build "$SOLUTION_FILE" --configuration Release --no-restore

      - name: Run Automated Tests
        run: dotnet test "$SOLUTION_FILE" --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Part 2 CI Complete
        run: echo "RaceDay documentation checks, build, and automated tests passed."
